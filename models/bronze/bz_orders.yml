version: 2

models:
  - name: bz_orders
    description: >
      bronze orders table
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "order_total - tax_paid = subtotal"
    columns:
      - name: ORDER_ID
        description: >
          unique and not_null order_id
        tests:
          - unique
          - not_null
      - name: ORDER_TOTAL
        tests:  
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 2000
                strictly: false
