name: sleekdata

profile: sleekdata

seed-paths: ["seeds"]
model-paths: ["models"]
macro-paths: ["macros"]
clean-targets:
  - "target"
  - "dbt_packages"

flags:
  fail_fast: true

seeds:
  # Builds seeds into '<your_schema_name>_raw'
  sleekdata:
    +schema: raw

models:
  sleekdata:
    +materialized: table
    +on_schema_change: fail
    +tags: sleekdata
    # Materialize staging models as views, and marts as tables
    bronze:
      +materialized: incremental
      +incremental_strategy: append
      +schema: bronze
      +tags: bronze
      +on_schema_change: append_new_columns
    silver:
      +materialized: table
      +schema: silver
      +tags: silver
      +on_schema_change: append_new_columns
    gold:
      +materialized: table
      +schema: gold
      +tags: gold
      +on_schema_change: append_new_columns

vars:
  default_date: 1900-01-01
  default_string: test
  bronze_schema: bz
  silver_schema: sl


